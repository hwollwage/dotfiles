
########################
####    KEYBINDS    ####
########################

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, Q, exec, $terminal
# bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, togglefloating,
bind = $mainMod, R, exec, $menu
bind = SUPER, V, exec, copyq toggle

bind = $mainMod, SPACE, exec, rofi -show drun

bind = $mainMod SHIFT, Right, movetoworkspace, +1
bind = $mainMod SHIFT, Left, movetoworkspace, -1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow


bind = SUPER, Escape, killactive
bind = CTRL ALT, escape, forcekillactive,

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# # Screenshot a window
# bind = $mainMod, PRINT, exec, hyprshot -m window
# # Screenshot a monitor
# bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
# bind = $shiftMod, PRINT, exec, hyprshot -m region
bind = ,PRINT, exec, hyprshot -m region

bind = $mainMod, Page_up, workspace, r+1
bind = $mainMod, Page_down, workspace, r-1

bind = $mainMod, Tab, workspace, +1
bind = $mainMod SHIFT, Tab, workspace, -1
