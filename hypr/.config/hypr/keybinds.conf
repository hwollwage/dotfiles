
########################
####    KEYBINDS    ####
########################

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

bind = SUPER SHIFT, P, exec, pkill -9 -x kanshi; sleep 0.3; hyprctl keyword monitor "eDP-1, preferred, auto, 1"; sleep 1; hyprctl keyword monitor "eDP-1, 1920x1080@60, 0x0, 1, mirror, HDMI-A-1"
bind = SUPER SHIFT, O, exec, pkill -9 -x kanshi; setsid kanshi >/dev/null 2>&1 &
bind = $mainMod, Q, exec, $terminal
# bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, togglefloating,
bind = $mainMod, R, exec, $menu
bind = SUPER, V, exec, copyq toggle

# wpctl / Wireplumber
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# wpctl (audio)
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# brightnessctl
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mainMod, SPACE, exec, rofi -show drun

bind = $mainMod SHIFT, Right, movetoworkspace, +1
bind = $mainMod SHIFT, Left, movetoworkspace, -1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow


bind = SUPER, Escape, killactive
bind = CTRL ALT, escape, forcekillactive,

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = ,PRINT, exec, hyprshot -m region -o /home/edelweiss/Pictures/Screenshots_hypr/

bind = $mainMod, Page_up, workspace, r+1
bind = $mainMod, Page_down, workspace, r-1

bind = $mainMod, Tab, workspace, +1
bind = $mainMod SHIFT, Tab, workspace, -1

bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

bind = SUPER SHIFT, L, exec, hyprlock
