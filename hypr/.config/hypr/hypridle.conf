########################
####    HYPRIDLE    ####
########################

general {
    lock_cmd = pkill -9 mpvpaper; pidof hyprpaper || hyprpaper & pidof hyprlock || hyprlock
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 900
    on-timeout = pkill hyprpaper; mpvpaper -l top -o "--loop-file=yes --no-audio" '*' ~/Videos/config-video/arch.mp4
    on-resume = pkill -9 mpvpaper; pidof hyprpaper || hyprpaper &
}

listener {
    timeout = 905
    on-timeout = loginctl lock-session
}

listener {
  timeout = 1200
  on-timeout = systemctl suspend
}
