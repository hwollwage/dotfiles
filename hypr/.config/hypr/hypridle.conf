
########################
####    HYPRIDLE    ####
########################

general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 120
    on-timeout = pkill hyprpaper; mpvpaper -l overlay -o "--loop-file=yes --ontop --no-audio" '*' ~/Videos/config-video/arch.mp4
    on-resume = pkill mpvpaper; hyprpaper &
}
