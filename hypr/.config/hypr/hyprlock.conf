--#######################
--###    HYPRLOCK    ####
--#######################

general {
  hide_cursor = false
}

# background wallpaper
background {
  monitor =
  path = $HOME/.config/hypr/assets/castle.png
  blur_passes = 2
  blur_size = 5
  brightness = 0.3
}

# greeting
label {
  monitor =
  text = ~ hi Oaklynn ~
  color = rgba(255, 255, 255, 1)
  font_size = 12
  font_family = JetBrainsMono Nerd Font Bold
  position = 30, -30
  halign = left
  valign = top
}

# date tanggal
label {
  monitor =
  text = cmd[update:1000] date +"%d %b %y"
  color = rgba(255, 255, 255, 1)
  font_size = 12
  font_family = JetBrainsMono Nerd Font Bold
  position = -30, -30
  halign = right
  valign = top
}

# clock jam
label {
  monitor =
  text = cmd[update:1000] echo "<span foreground='##F5A9B8'>$(date +"%H")</span><span foreground='##FFFFFF'>:</span><span foreground='##5BCEFA'>$(date +"%M")</span>"
  font_size = 55
  font_family = JetBrainsMono Nerd Font Bold
  position = 0, 270
  halign = center
  valign = center
}

# album logo album_art
image {
  monitor =
  path = /tmp/hyprlock_cover.jpg
  size = 300
  rounding = 10
  border_size = 2
  border_color = rgba(245, 169, 184, 1) rgba(255, 255, 255, 1) rgba(91, 206, 250, 1) 90deg
  reload_time = 2
  reload_cmd =
  onclick = $HOME/.config/hypr/scripts/media_toggle.sh toggle
  position = 0, 60
  halign = center
  valign = center
}

# media player media_player, title judul
label {
  monitor =
  text = cmd[update:1000] cat /tmp/hyprlock_title.txt 2>/dev/null || echo " "
  onclick = $HOME/.config/hypr/scripts/media_toggle.sh toggle
  color = rgba(255, 255, 255, 1)
  font_size = 15
  font_family = JetBrainsMono Nerd Font Bold
  position = 0, -120
  halign = center
  valign = center
}

# previous button (left - blue)
label {
  monitor =
  text = ⏮
  onclick = $HOME/.config/hypr/scripts/media_toggle.sh prev
  color = rgba(91, 206, 250, 1)
  font_size = 25
  font_family = JetBrainsMono Nerd Font Bold
  position = -45, -160
  halign = center
  valign = center
}

# play button (center - white)
label {
  monitor =
  text = cmd[update:500] cat /tmp/hyprlock_status.txt 2>/dev/null || echo "▶"
  onclick = $HOME/.config/hypr/scripts/media_toggle.sh toggle
  color = rgba(255, 255, 255, 1)
  font_size = 25
  font_family = JetBrainsMono Nerd Font Bold
  position = 0, -160
  halign = center
  valign = center
}

# next button (right - pink)
label {
  monitor =
  text = ⏭
  onclick = $HOME/.config/hypr/scripts/media_toggle.sh next
  color = rgba(245, 169, 184, 1)
  font_size = 25
  font_family = JetBrainsMono Nerd Font Bold
  position = 45, -160
  halign = center
  valign = center
}

# password input field
input-field {
  monitor =
  size = 400, 48
  position = 0, -215
  outline_thickness = 2
  dots_size = 0.20
  dots_spacing = 0.5
  dots_center = true
  outer_color = rgba(91, 206, 250, 1) rgba(245, 169, 184, 1) rgba(255, 255, 255, 1) 18deg
  inner_color = rgba(15, 20, 25, 0.75)
  font_color = rgb(200, 210, 215)
  fade_on_empty = false
  placeholder_text = <span foreground="##7a8b99">masukan passwordnya kink 😹</span>
  hide_input = false
  rounding = 0
  check_color = rgba(255, 255, 255, 1) rgba(245, 169, 184, 1) rgba(91, 206, 250, 1) 45deg
  fail_color = rgb(f75348)
  fail_text = <i>salah cik 😹 <b>[$ATTEMPTS]</b></i>
  halign = center
  valign = center
  font_family = JetBrainsMono Nerd Font Bold
}
