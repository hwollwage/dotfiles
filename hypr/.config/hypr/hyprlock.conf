general {
  disable_loading_bar = true
  hide_cursor = true
  ignore_empty_input = true
}

background {
  monitor = 
  path = ~/.config/hypr/castle.png
  blur_passes = 2
  blur_size = 7
}

label {
  monitor = 
  text = cmd[update:1000] echo "$TIME"
  color = rgba(242,243,244,0.75)
  font_size = 80
  font_family = JetBrainsMono Nerd Font
  position = 0, 200
  halign = center
  valign = center
}

input-field {
  monitor = 
  size = 250, 50
  outline_thickness = 3
  dots_size = 0.25
  dots_spacing = 0.4
  dots_center = true
  outer_color = rgba(255,255,255,0.15)
  inner_color = rgba(0,0,0,0.5)
  font_color = rgba(200,200,200)
  fade_on_empty = false
  placeholder_text = <i>Password...</i>
  position = 0, -150
  halign = center
  valign = center
}


label {
  monitor =
    # Mengambil judul lagu, jika kosong tidak menampilkan apa-apa
  text = cmd[update:1000] status=$(playerctl status 2>/dev/null); if [ "$status" = "Playing" ] || [ "$status" = "Paused" ]; then title=$(playerctl metadata --format "{{title}}" 2>/dev/null | cut -c1-40); artist=$(playerctl metadata --format "{{artist}}" 2>/dev/null | cut -c1-40); if [ "$status" = "Playing" ]; then icon="  "; else icon="  "; fi; echo "<span font_weight='bold' size='large' foreground='##ffffff'>$title</span>\n<span size='medium' foreground='##b3b3b3'>$artist</span>\n<span size='small' foreground='##808080'>$icon $status on Spotify</span>"; else echo ""; fi
    color = rgba(255, 255, 255, 0.9)
    font_size = 18
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] playerctl metadata --format "{{artist}}" 2>/dev/null || echo ""
    color = rgba(200, 200, 200, 0.6)
    font_size = 14
    font_family = JetBrains Mono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] status=$(playerctl status 2>/dev/null); if [ "$status" = "Playing" ]; then echo "   Playing on $(playerctl -l 2>/dev/null | head -n1)"; elif [ "$status" = "Paused" ]; then echo "   Paused"; else echo ""; fi
    color = rgba(150, 150, 150, 0.6)
    font_size = 11
    font_family = JetBrains Mono Nerd Font
    position = 0, -35
    halign = center
    valign = center
}
